
networks:
  my-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  rabbitmq_data:

services:

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: msrabbitmq
    ports:
    - "5672:5672"
    - "15672:15672"
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  prometheus:
    image: prom/prometheus:latest
    container_name: test-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      - ./eureka-targets:/etc/prometheus/eureka-targets
    networks:
      - my-network
    ports:
      - 9090:9090
  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    networks:
      - my-network
    volumes:
      - grafana_data:/var/lib/grafana