global:
  scrape_interval: 5s


scrape_configs:
  - job_name: "api-produtos-job"
    metrics_path: "actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080","host.docker.internal:3030","host.docker.internal:3031","host.docker.internal:3032"]
        labels:
          application: "api-produtos"